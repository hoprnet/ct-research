[project]
name = "ct-app"
version = "3.14.5"
requires-python = ">=3.14"
dependencies = [
    "core",
    "pre-commit>=4.7.0",
    "pyyaml>=6.0.3",
]

[tool.setuptools]
packages = ["core"]

[tool.uv.sources]
core = { workspace = true }

[tool.uv.workspace]
members = [
    "core",
    "core/api",
    "core/blokli",
    "core/components",
    "core/config_parser",
    "core/messages",
    "core/mixins",
    "core/types"
]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
    "python-dotenv>=1.2.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-mock>=3.17.0",
    "pytest-cov>=7.1.0",
    "mypy>=2.4.0",
    "types-pyyaml>=6.0.12.20260906",
]
lint = [
    "black==26.10.1",
]
typecheck = [
    "mypy>=2.4.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.black]
line-length = 100
target-version = ['py314']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
lint.select = ["E", "F"]
lint.ignore = []

[tool.pytest.ini_options]
testpaths = ["test"]
minversion = "7.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = ["-ra", "-q"]
markers = [
    "stress: marks tests as stress tests (deselect with '-m \"not stress\"')",
    "benchmark: marks tests as performance benchmarks (run with '-m benchmark')"
]

log_cli = true
log_cli_level = "CRITICAL"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.mypy]
# Python version
python_version = "3.14"

# Follow imports
follow_imports = "normal"
ignore_missing_imports = true

# Show error codes
show_error_codes = true
show_column_numbers = true
pretty = true

# Explicit package bases to avoid module name conflicts
explicit_package_bases = true

# Warn on certain issues but don't require full type annotations
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false

# Check the bodies of functions without type annotations
check_untyped_defs = true

# Allow operations on Optional without strict checking
no_implicit_optional = true
strict_optional = false

# Paths to check
files = ["core/", "test/", "scripts/"]

# Exclude patterns
exclude = "^(core/.*/__pycache__/|core/.*/\\..*|\\.venv/|build/|dist/).*"

# Per-module options - external libraries
