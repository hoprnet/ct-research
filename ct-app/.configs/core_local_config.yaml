---
# =============================================================================
# 
# =============================================================================
environment: local

flags:
  node:
    healthcheck: 15s
    retrieve_peers: 30s
    relay_messages: On
    retrieve_balances: 1m

    observe_message_queue: On
    maintain_sessions: 15s
    
# =============================================================================
# 
# =============================================================================
incentive:
  min_outgoing_channels: 2
  min_channel_balance: "1 wxHOPR"
  burst_rate: 1                   # Mbit/s
  burst_duration: 5s
  target_relayer_interval: 30s   # average time between two bursts to the same relayer, across all CT nodes
  max_concurrent_bursts_per_ct: 0 # 0 = no limit
  ct_node_count: 2                # CT nodes in the deployment

# =============================================================================
# 
# =============================================================================
peer:
  excluded_peers: []

# =============================================================================
#
# =============================================================================
sessions:
  green_destinations: 
    - "0x24bb711c1612f57d03b4504c78241b3bd597e9fc"
    - "0x5b1514a79b61bfa0ebb78ec90283c6a356f3146b"
  blue_destinations: []
  session_retry_base_delay: 2s
  session_retry_max_delay: 60s
  message_worker_count: 10
  message_queue_maxsize: 10000
  receive_timeout: 5s

# =============================================================================
#
# =============================================================================
...
