---
# =============================================================================
# 
# =============================================================================
environment: staging

flags:
  node:

    healthcheck: 15s
    retrieve_peers: 1m
    relay_messages: On
    retrieve_balances: 5m

    observe_message_queue: On
    maintain_sessions: 15s
    
# =============================================================================
# 
# =============================================================================
incentive:
  min_outgoing_channels: 5
  min_channel_balance: "50 wxHOPR"
  burst_rate: 8                   # Mbit/s
  burst_duration: 10s
  target_relayer_interval: 600s   # average time between two bursts to the same relayer, across all CT nodes
  max_concurrent_bursts_per_ct: 0 # 0 = no limit
  ct_node_count: 2                # CT nodes in the deployment

# =============================================================================
# 
# =============================================================================
peer:
  excluded_peers: []

# =============================================================================
#
# =============================================================================
sessions:
  green_destinations: 
  - "0xc0efe53308b4d90d1de82ff44bb9067c4d6bed02"
  - "0xac1dd1393c9b45b6c566ebf3886c02fa4e213d18"
  blue_destinations: []
  session_retry_base_delay: 2s
  session_retry_max_delay: 60s
  message_worker_count: 10
  message_queue_maxsize: 10000
  receive_timeout: 5s

# =============================================================================
#
# =============================================================================
...
