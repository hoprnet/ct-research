---
name: Zizmor

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - ".github/**"
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-zizmor
  cancel-in-progress: true

permissions: {}

jobs:
  zizmor:
    uses: hoprnet/hopr-workflows/.github/workflows/checks-zizmor.yaml@43c833e72dffe4f2f3be60193733e5657f8aa0d7 # workflow-checks-zizmor-v2.0.0
    permissions:
      contents: read
      security-events: write
    with:
      repo_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      cachix_cache_name: ct-dapp
      zizmor_command: 'nix develop -L ./ct-app#ci -c bash -c "zizmor --format sarif . > results.sarif"'
      runner: depot-ubuntu-24.04-4
      cachix_cache_name: ct-dapp
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
