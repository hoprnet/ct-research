---
name: Merge
on:
  pull_request:
    types:
      - closed
      # - synchronize
    branches:
      - main
concurrency:
  group: merge-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false
permissions: {}
jobs:
  build-docker:
    name: Docker
    if: github.event.pull_request.merged == true
    uses: hoprnet/hopr-workflows/.github/workflows/build-docker.yaml@5be6fbca6ea8b13afa4d111724ff83c78456d13e # build-docker-v3.4.3
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      source_branch: ${{ github.event.pull_request.base.ref }}
      version_type: pr
      build_matrix: >-
        [
          {
            "runner": "depot-ubuntu-24.04-4",
            "architecture": "x86_64-linux",
            "build_command": "cd ct-app && nix run .#docker-x86_64-linux"
          }
        ]
      cachix_cache_name: ct-dapp
      build_file: ct-app/pyproject.toml
      docker_image_name: cover-traffic
      fail_on_scan_vulnerabilities: ${{ vars.FAIL_ON_SCAN_VULNERABILITIES }}
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  # Restores the staging restart that build-docker 0.11.0 ran after publishing
  # (inputs deployment_namespace / deployment_label_selector, removed in v3.4.3).
  restart-staging:
    name: Restart staging
    needs:
      - build-docker
    if: >-
      vars.DEPLOY_STAGING_MERGED_PR == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: depot-ubuntu-22.04-4
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup GCP
        uses: hoprnet/hopr-workflows/actions/setup-gcp@2ca6e5b55819505e4e304ed3b0ff62da01cc7c0e # setup-gcp-v4
        with:
          install_sdk: 'true'
          login_gke: 'true'
          gke_project: hopr-staging
          gke_cluster_name: cluster-staging

      - name: Restart staging deployment
        env:
          DEPLOYMENT_NAMESPACE: ctdapp
          DEPLOYMENT_LABEL_SELECTOR: hoprds.hoprnet.org/cluster=${{ vars.CTDAPP_STAGING_DEPLOYMENT_CLUSTER }}
        run: |
          echo "Starting deployment restart"
          if ! kubectl rollout restart deployments -n "$DEPLOYMENT_NAMESPACE" -l "$DEPLOYMENT_LABEL_SELECTOR"; then
            echo "Failed to restart deployment"
            exit 1
          fi
          if ! kubectl rollout status deployments -n "$DEPLOYMENT_NAMESPACE" -l "$DEPLOYMENT_LABEL_SELECTOR" --timeout=600s; then
            echo "Deployment did not complete within the timeout period"
            exit 1
          fi
          echo "Restart completed successfully"

  notify:
    name: Notify failure
    needs:
      - build-docker
    if: ${{ always() && failure() }}
    runs-on: depot-ubuntu-24.04
    permissions: {}
    steps:
      - name: Notify failed merge pipeline
        uses: zulip/github-actions-zulip/send-message@e4c8f27c732ba9bd98ac6be0583096dea82feea5 # v1.0.2
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: ${{ secrets.ZULIP_EMAIL }}
          organization-url: "https://hopr.zulipchat.com"
          type: "stream"
          to: "HOPRd"
          topic: "Core"
          content: |
            The merge pipeline has failed for pull request [#${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
